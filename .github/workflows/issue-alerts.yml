# Issue alerts: when someone opens an issue here, Claude reads it and sends you a short note in Discord: what's
# wrong, which piece, how bad, what the report is missing, and whether it's been reported before. A reply on an open
# issue sends a short ping too. Nothing is posted on GitHub and nothing here changes.
#
# Settings > Secrets and variables > Actions > New repository secret:
#   ANTHROPIC_API_KEY    an API key from your Console workspace (the same one as Yassify's is fine)
#   DISCORD_WEBHOOK_URL  Discord: your channel > Edit Channel > Integrations > Webhooks > New Webhook > Copy Webhook URL
name: Issue alerts

on:
  issues:
    types: [opened, reopened]
  issue_comment:
    types: [created]

permissions: {}

jobs:
  issue:
    if: github.event_name == 'issues'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: read
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Read it and tell you
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          DISCORD: ${{ secrets.DISCORD_WEBHOOK_URL }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          ISSUE: ${{ github.event.issue.number }}
          ACTION: ${{ github.event.action }}
          PLUGIN: LE-C UI
          MODEL: claude-sonnet-5-5
        run: bash .github/alerts/alert.sh issue

  reply:
    # Replies from people other than you (and anyone you've added to the repo).
    if: >-
      github.event_name == 'issue_comment' && github.event.issue.pull_request == null &&
      github.event.issue.state == 'open' && github.event.comment.user.type != 'Bot' &&
      !contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association)
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          sparse-checkout: .github

      - name: Tell you
        env:
          PLUGIN: LE-C UI
          DISCORD: ${{ secrets.DISCORD_WEBHOOK_URL }}
          REPO: ${{ github.repository }}
          ISSUE: ${{ github.event.issue.number }}
          TITLE: ${{ github.event.issue.title }}
          WHO: ${{ github.event.comment.user.login }}
          BODY: ${{ github.event.comment.body }}
          URL: ${{ github.event.comment.html_url }}
        run: bash .github/alerts/alert.sh reply
